<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的威士忌评分与拍卖记录</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --ink: #1d252d;
      --muted: #64717d;
      --line: #dbe1e7;
      --soft: #eef2f5;
      --teal: #0f766e;
      --wine: #8f2d46;
      --gold: #b7791f;
      --blue: #2f5d8c;
      --shadow: 0 12px 32px rgba(30, 40, 50, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input, select { font: inherit; }
    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      min-height: 100vh;
    }
    .main {
      padding: 22px;
      min-width: 0;
    }
    .detail {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 22px 22px 22px 0;
    }
    .titlebar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    .subtitle {
      margin-top: 6px;
      color: var(--muted);
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(116px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      box-shadow: var(--shadow);
    }
    .stat b {
      display: block;
      font-size: 22px;
      line-height: 1.1;
    }
    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 150px 150px 150px;
      gap: 10px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .field {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      min-height: 38px;
      padding: 0 10px;
    }
    .field input, .field select {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      min-width: 0;
      color: var(--ink);
    }
    .segmented {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      min-height: 38px;
      background: #fff;
    }
    .segmented button {
      border: 0;
      border-right: 1px solid var(--line);
      background: #fff;
      padding: 0 10px;
      color: var(--muted);
      cursor: pointer;
      flex: 1;
      white-space: nowrap;
    }
    .segmented button:last-child { border-right: 0; }
    .segmented button.active {
      background: var(--teal);
      color: #fff;
    }
    .table-wrap {
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1040px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: middle;
    }
    th {
      position: sticky;
      top: 0;
      background: #f9fafb;
      z-index: 1;
      color: #40505e;
      font-size: 12px;
      font-weight: 700;
      user-select: none;
      cursor: pointer;
    }
    tr { cursor: pointer; }
    tbody tr:hover { background: #f8fafb; }
    tbody tr.selected { background: #edf7f5; }
    .bottle-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 320px;
    }
    .bottle {
      width: 34px;
      height: 64px;
      object-fit: contain;
      flex: 0 0 auto;
    }
    .name {
      font-weight: 700;
      color: var(--ink);
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }
    .rating {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 30px;
      border-radius: 6px;
      background: #eef7f5;
      color: var(--teal);
      font-weight: 800;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--soft);
      color: #40505e;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 650;
    }
    .pill.ok { background: #eef7f5; color: var(--teal); }
    .pill.warn { background: #fff6e8; color: var(--gold); }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .detail-head {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 14px;
    }
    .detail-bottle {
      width: 72px;
      height: 132px;
      object-fit: contain;
      background: #f7f8fa;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
    }
    .detail h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .kv {
      background: #f8fafb;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      min-width: 0;
    }
    .kv span {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }
    .kv b {
      display: block;
      margin-top: 2px;
      overflow-wrap: anywhere;
    }
    .detail-section {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }
    .detail-section:last-child { border-bottom: 0; }
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 800;
      color: #344452;
    }
    .chart {
      width: 100%;
      height: 220px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
      overflow: hidden;
    }
    .empty {
      display: grid;
      place-items: center;
      min-height: 120px;
      color: var(--muted);
      text-align: center;
      padding: 18px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fbfcfd;
    }
    .lot-list {
      display: grid;
      gap: 8px;
      max-height: 360px;
      overflow: auto;
    }
    .lot {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px;
      background: #fff;
    }
    .lot-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .price {
      font-weight: 850;
      color: var(--wine);
      white-space: nowrap;
    }
    .source-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }
    .source-stat {
      background: #f8fafb;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      min-width: 0;
    }
    .source-stat span {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }
    .source-stat b {
      display: block;
      margin-top: 2px;
      overflow-wrap: anywhere;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      min-height: 34px;
      padding: 0 10px;
      background: #fff;
      color: var(--ink);
      font-weight: 700;
    }
    .footer-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 1100px) {
      .app { grid-template-columns: 1fr; }
      .detail {
        position: static;
        height: auto;
        padding: 0 22px 22px;
      }
      .stats { grid-template-columns: repeat(3, minmax(120px, 1fr)); }
      .toolbar { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 640px) {
      .main, .detail { padding: 14px; }
      .titlebar { display: block; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toolbar { grid-template-columns: 1fr; }
      .detail-head { grid-template-columns: 58px 1fr; }
      .detail-bottle { width: 58px; height: 108px; }
      .source-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

    </aside>
  </div>

ltCount":0,"matchedLots":0,"rawLots":0,"rejectedLots":0,"rejectionReasons":{},"lastSold":null,"lots":[]}}]};</script>
  <script>
    const { stats, whiskies } = window.REPORT_DATA;
    const state = {
      search: "",
      minRating: 0,
      distillery: "",
      auction: "all",
      sortKey: "myRating",
      sortDir: "desc",
      selectedId: whiskies[0]?.id,
    };

    const fmtGbp = new Intl.NumberFormat("en-GB", { style: "currency", currency: "GBP", maximumFractionDigits: 0 });
    const fmtDate = new Intl.DateTimeFormat("zh-CN", { year: "numeric", month: "short" });
    const byId = new Map(whiskies.map((row) => [row.id, row]));

    function n(value) { return Number.isFinite(value) ? value : 0; }
    function money(value) { return Number.isFinite(value) ? fmtGbp.format(value) : "—"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    function enriched(row) {
      return {
        ...row,
        ageNum: n(Number(row.age)),
        strengthNum: n(Number(String(row.strength).replace(/[^0-9.]/g, ""))),
        auctionLots: row.wa.matchedLots,
        lastHammer: row.wa.lastHammer?.priceGbp || 0,
        maxHammer: row.wa.maxHammer || 0,
      };
    }

    const rows = whiskies.map(enriched);

    function init() {
      document.getElementById("generatedAt").textContent = new Date(stats.generatedAt).toLocaleString("zh-CN");
      document.getElementById("stats").innerHTML = [
        ["喝过", stats.total, `${stats.scored} 条有个人评分`],
        ["均分", stats.avgRating, "我的平均评分"],
        ["最高分", stats.topRating, "个人最高评分"],
        ["WA 匹配", stats.auctionMatched, "有历史记录酒款"],
        ["Lot", stats.auctionLots, `高置信；过滤 ${stats.auctionRejectedLots} 条`],
      ].map(([label, value, caption]) => `<div class="stat"><b>${value}</b><span>${label} · ${caption}</span></div>`).join("");

      const distilleries = [...new Set(rows.map((row) => row.distillery))].sort((a, b) => a.localeCompare(b));
      document.getElementById("distilleryFilter").innerHTML += distilleries.map((name) => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join("");

      document.getElementById("searchInput").addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); render(); });
      document.getElementById("ratingFilter").addEventListener("change", (event) => { state.minRating = Number(event.target.value); render(); });
      document.getElementById("distilleryFilter").addEventListener("change", (event) => { state.distillery = event.target.value; render(); });
      document.querySelectorAll("[data-auction]").forEach((button) => {
        button.addEventListener("click", () => {
          state.auction = button.dataset.auction;
          document.querySelectorAll("[data-auction]").forEach((item) => item.classList.toggle("active", item === button));
          render();
        });
      });
      document.querySelectorAll("th[data-sort]").forEach((th) => {
        th.addEventListener("click", () => {
          const key = th.dataset.sort;
          state.sortDir = state.sortKey === key && state.sortDir === "desc" ? "asc" : "desc";
          state.sortKey = key;
          render();
        });
      });
      render();
    }

    function filteredRows() {
      const term = state.search;
      return rows.filter((row) => {
        const haystack = [row.name, row.distillery, row.caskNumber, row.strength, row.size].join(" ").toLowerCase();
        if (term && !haystack.includes(term)) return false;
        if (row.myRating < state.minRating) return false;
        if (state.distillery && row.distillery !== state.distillery) return false;
        if (state.auction === "matched" && row.wa.matchedLots === 0) return false;
        if (state.auction === "missing" && row.wa.matchedLots > 0) return false;
        return true;
      }).sort((a, b) => {
        const av = a[state.sortKey];
        const bv = b[state.sortKey];
        const result = typeof av === "string" ? av.localeCompare(bv) : n(av) - n(bv);
        return state.sortDir === "asc" ? result : -result;
      });
    }

    function render() {
      const visible = filteredRows();
      if (!visible.some((row) => row.id === state.selectedId)) {
        state.selectedId = visible[0]?.id || rows[0]?.id;
      }
      document.getElementById("visibleCount").textContent = `${visible.length} / ${rows.length} 支`;
      document.getElementById("tbody").innerHTML = visible.map((row) => rowHtml(row)).join("");
      document.querySelectorAll("tbody tr").forEach((tr) => {
        tr.addEventListener("click", () => {
          state.selectedId = Number(tr.dataset.id);
          render();
        });
      });
      renderDetail(byId.get(state.selectedId) || visible[0] || rows[0]);
    }

    function rowHtml(row) {
      const selected = row.id === state.selectedId ? " selected" : "";
      const auctionPill = row.wa.matchedLots
        ? `<span class="pill ok">${row.wa.matchedLots} lots</span>`
        : `<span class="pill warn">未匹配</span>`;
      return `
        <tr class="${selected}" data-id="${row.id}">
          <td><div class="bottle-cell"><img class="bottle" src="${row.image}" alt=""><div><div class="name">${escapeHtml(row.name)}</div><div class="meta">${escapeHtml(row.distillery)} · ${escapeHtml(row.size)} · ${escapeHtml(row.caskNumber || "-")}</div></div></div></td>
          <td><span class="rating">${row.myRating || "—"}</span></td>
          <td>${row.whiskybaseRating?.toFixed(2) || "—"}</td>
          <td>${escapeHtml(row.age || "-")}</td>
          <td>${escapeHtml(row.strength || "-")}</td>
          <td>${row.votes || "—"}</td>
          <td>${auctionPill}</td>
          <td>${money(row.wa.lastHammer?.priceGbp)}</td>
          <td>${money(row.wa.maxHammer)}</td>
        </tr>`;
    }

    function hammerPoints(row) {
      const grouped = new Map();
      for (const lot of row.wa.lots) {
        if (lot.priceType !== "Hammer price" || !lot.date || !Number.isFinite(lot.priceGbp)) continue;
        if (!grouped.has(lot.date)) grouped.set(lot.date, []);
        grouped.get(lot.date).push(lot.priceGbp);
      }
      return [...grouped.entries()].map(([date, prices]) => ({
        date,
        ts: new Date(date).getTime(),
        price: prices.reduce((sum, value) => sum + value, 0) / prices.length,
        count: prices.length,
      })).sort((a, b) => a.ts - b.ts);
    }

    function chartSvg(row) {
      const points = hammerPoints(row);
      if (points.length < 2) return `<div class="empty">成交点不足，暂无折线图</div>`;
      const w = 640, h = 220, pad = { l: 54, r: 18, t: 18, b: 34 };
      const minX = points[0].ts, maxX = points[points.length - 1].ts;
      const prices = points.map((p) => p.price);
      const minY = Math.min(...prices), maxY = Math.max(...prices);
      const yFloor = Math.max(0, minY * 0.9);
      const yCeil = maxY * 1.08;
      const x = (p) => pad.l + ((p.ts - minX) / Math.max(1, maxX - minX)) * (w - pad.l - pad.r);
      const y = (p) => h - pad.b - ((p.price - yFloor) / Math.max(1, yCeil - yFloor)) * (h - pad.t - pad.b);
      const d = points.map((p, i) => `${i ? "L" : "M"} ${x(p).toFixed(1)} ${y(p).toFixed(1)}`).join(" ");
      const ticks = [yFloor, (yFloor + yCeil) / 2, yCeil];
      const yearTicks = [...new Set(points.map((p) => new Date(p.date).getFullYear()))].filter((_, i, arr) => i === 0 || i === arr.length - 1 || i % Math.ceil(arr.length / 4) === 0);
      return `
        <svg class="chart" viewBox="0 0 ${w} ${h}" role="img">
          <rect x="0" y="0" width="${w}" height="${h}" fill="#fbfcfd"></rect>
          ${ticks.map((tick) => {
            const yy = h - pad.b - ((tick - yFloor) / Math.max(1, yCeil - yFloor)) * (h - pad.t - pad.b);
            return `<line x1="${pad.l}" x2="${w - pad.r}" y1="${yy}" y2="${yy}" stroke="#dbe1e7"/><text x="10" y="${yy + 4}" font-size="11" fill="#64717d">£${Math.round(tick).toLocaleString("en-GB")}</text>`;
          }).join("")}
          ${yearTicks.map((year) => {
            const p = points.find((point) => new Date(point.date).getFullYear() === year);
            return `<text x="${x(p)}" y="${h - 10}" text-anchor="middle" font-size="11" fill="#64717d">${year}</text>`;
          }).join("")}
          <path d="${d}" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></path>
          ${points.map((p) => `<circle cx="${x(p)}" cy="${y(p)}" r="${p.count > 1 ? 4.5 : 3.5}" fill="#8f2d46"><title>${p.date}: ${money(p.price)} · ${p.count} lot</title></circle>`).join("")}
        </svg>`;
    }

    function lotHtml(lot) {
      return `
        <div class="lot">
          <div class="lot-top">
            <div>
              <a class="name" href="${lot.url}" target="_blank" rel="noreferrer">${escapeHtml(lot.title || lot.lotId)}</a>
              <div class="meta">#${escapeHtml(lot.lotId)} · ${escapeHtml(lot.auction || "-")} · ${escapeHtml(lot.specs || "-")}</div>
            </div>
            <div class="price">${money(lot.priceGbp)}</div>
          </div>
          <div class="meta">${escapeHtml(lot.priceType || "")}${lot.reserve ? " · " + escapeHtml(lot.reserve) : ""}</div>
        </div>`;
    }

    function reasonText(reasonCounts) {
      const entries = Object.entries(reasonCounts || {}).sort((a, b) => b[1] - a[1]);
      if (!entries.length) return "—";
      return entries.slice(0, 6).map(([reason, count]) => escapeHtml(reason) + " × " + count).join("；");
    }

    function sourceStat(label, value) {
      return `<div class="source-stat"><span>${escapeHtml(label)}</span><b>${escapeHtml(value)}</b></div>`;
    }

    function swaSection(row) {
      const source = row.swa || {};
      if (!source.sampled) {
        return `
          <div class="detail-section">
            <div class="section-title"><span>SWA 试点交叉验证</span><span class="pill warn">未采样</span></div>
            <div class="empty">这支酒还没有跑 Scotch Whisky Auctions 试点抓取</div>
          </div>`;
      }
      const lots = source.lots || [];
      const status = lots.length ? "ok" : "warn";
      const latest = source.lastSold?.priceGbp ? money(source.lastSold.priceGbp) : "—";
      return `
        <div class="detail-section">
          <div class="section-title"><span>SWA 试点交叉验证</span><span class="pill ${status}">${lots.length} matched · ${source.rawLots} checked</span></div>
          <div class="source-grid">
            ${sourceStat("搜索命中", source.resultCount || 0)}
            ${sourceStat("通过匹配", lots.length)}
            ${sourceStat("过滤", source.rejectedLots || 0)}
            ${sourceStat("最近售出", latest)}
            ${sourceStat("查询词", source.query || "-")}
            ${sourceStat("拒绝原因", reasonText(source.rejectionReasons))}
          </div>
          ${lots.length ? `<div class="lot-list">${lots.slice(0, 12).map(lotHtml).join("")}</div>` : `<div class="empty">SWA 搜到候选 lot，但没有通过年份、年龄、ABV、容量、桶号等校验</div>`}
          <div class="footer-note">SWA 当前只作为第二来源试点和交叉验证，不计入 WA 主统计、表格排序或成交折线。${source.searchUrl ? ` <a href="${source.searchUrl}" target="_blank" rel="noreferrer">打开 SWA 搜索</a>` : ""}</div>
        </div>`;
    }

    function renderDetail(row) {
      if (!row) return;
      const lots = row.wa.lots || [];
      const hammerCount = row.wa.hammerLots;
      document.getElementById("detailPanel").innerHTML = `
        <div class="detail-head">
          <img class="detail-bottle" src="${row.image}" alt="">
          <div>
            <h2>${escapeHtml(row.name)}</h2>
            <div class="meta">${escapeHtml(row.distillery)} · ${escapeHtml(row.strength)} · ${escapeHtml(row.size)}</div>
            <div class="detail-grid">
              <div class="kv"><span>我的评分</span><b>${row.myRating || "—"}</b></div>
              <div class="kv"><span>WB 均分</span><b>${row.whiskybaseRating?.toFixed(2) || "—"}</b></div>
              <div class="kv"><span>年龄</span><b>${escapeHtml(row.age || "-")}</b></div>
              <div class="kv"><span>桶号</span><b>${escapeHtml(row.caskNumber || "-")}</b></div>
            </div>
            <div class="links">
              <a class="link-btn" href="${row.whiskybaseUrl}" target="_blank" rel="noreferrer">Whiskybase</a>
              <a class="link-btn" href="${row.wa.searchUrl}" target="_blank" rel="noreferrer">WA 搜索</a>
            </div>
          </div>
        </div>
        <div class="detail-section">
          <div class="section-title"><span>历史成交</span><span class="pill ${hammerCount ? "ok" : "warn"}">${hammerCount} hammer · ${lots.length} lots</span></div>
          ${chartSvg(row)}
          <div class="footer-note">WA 查询关键词：${escapeHtml(row.wa.query)}；搜索结果：${row.wa.resultCount} 条，抓取：${row.wa.rawLots} 条，报告收录：${lots.length} 条，过滤：${row.wa.rejectedLots} 条。</div>
        </div>
        <div class="detail-section">
          <div class="section-title"><span>最近 lot</span><span class="meta">${lots.length ? "按搜索页顺序" : ""}</span></div>
          ${lots.length ? `<div class="lot-list">${lots.slice(0, 24).map(lotHtml).join("")}</div>` : `<div class="empty">Whisky Auctioneer 未匹配到价格记录</div>`}
        </div>
        ${swaSection(row)}`;
    }

    init();
  </script>
</body>
</html>
